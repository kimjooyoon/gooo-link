name: Core improvement selection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Bind exact subject identity
        run: echo "SUBJECT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Observe released Gooo selection graph
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/core-activity-cardinality-release-lock-v1.json
          tag=$(jq -r '.tag' "$lock")
          tag_object=$(jq -r '.tag_object_sha' "$lock")
          target=$(jq -r '.target_commit_sha' "$lock")
          asset=gooo-linux-amd64.tar.gz
          digest=$(jq -r --arg name "$asset" '.assets[]|select(.name==$name)|(.sha256 // (.digest|sub("^sha256:";"")))' "$lock")
          gh api "repos/kimjooyoon/meta-ontology-go/git/ref/tags/$tag" > "$RUNNER_TEMP/core-ref.json"
          jq -e --arg sha "$tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/core-ref.json" >/dev/null
          gh api "repos/kimjooyoon/meta-ontology-go/git/tags/$tag_object" > "$RUNNER_TEMP/core-tag.json"
          jq -e --arg sha "$target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/core-tag.json" >/dev/null
          gh api "repos/kimjooyoon/meta-ontology-go/releases/tags/$tag" > "$RUNNER_TEMP/core-release.json"
          asset_id=$(jq -r --arg name "$asset" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/core-release.json")
          gh api -H 'Accept: application/octet-stream' "repos/kimjooyoon/meta-ontology-go/releases/assets/$asset_id" > "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/core"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/core"
          chmod +x "$RUNNER_TEMP/core/gooo"
          "$RUNNER_TEMP/core/gooo" check --json examples/core-improvement-selection/main.gooo > "$RUNNER_TEMP/syntax.json"
          "$RUNNER_TEMP/core/gooo" check --semantic --json examples/core-improvement-selection/main.gooo > "$RUNNER_TEMP/semantic.json"
          "$RUNNER_TEMP/core/gooo" graph dump examples/core-improvement-selection/main.gooo > "$RUNNER_TEMP/graph.json"
          jq -e '.status=="ok"' "$RUNNER_TEMP/syntax.json" "$RUNNER_TEMP/semantic.json" >/dev/null
          jq -e '.schema_version=="gooo-graph/v1"' "$RUNNER_TEMP/graph.json" >/dev/null

          denominator=contracts/core-improvement-selection-denominator-v1.json
          source=examples/core-improvement-selection/main.gooo
          expected=$(jq -r '.target_cells' "$denominator")
          mkdir -p "$RUNNER_TEMP/core-resolutions"
          while IFS=$'\t' read -r ordinal activity; do
            printf -v receipt '%s/core-resolutions/%02d-%s.json' "$RUNNER_TEMP" "$ordinal" "$activity"
            "$RUNNER_TEMP/core/gooo" graph resolve-activity "$source" --name "$activity" > "$receipt"
            jq -e --arg activity "$activity" '
              .schema=="gooo/activity-cardinality-resolution/v1" and
              .selector.name==$activity and .decision=="CLOSED" and
              .occurrences==1 and (.matches|length)==1 and
              .claim.state=="CLOSED" and .claim.stage=="RESOLUTION" and
              .claim.step=="RESOLVE_ACTIVITY_CARDINALITY" and
              .claim.reason=="ACTIVITY_UNIQUELY_RESOLVED" and
              .claim.next_operation=="USE_RESOLVED_ACTIVITY" and
              .claim.proof_choice=="COHERENCE" and
              .subject.source_file=="examples/core-improvement-selection/main.gooo"
            ' "$receipt" >/dev/null
          done < <(jq -r '.cells[]|[.ordinal,.activity]|@tsv' "$denominator")
          jq -S -s '.' "$RUNNER_TEMP"/core-resolutions/*.json > "$RUNNER_TEMP/core-resolution-receipts.json"
          jq -S -n \
            --arg repository "kimjooyoon/meta-ontology-go" \
            --arg tag "$tag" \
            --arg tag_object_sha "$tag_object" \
            --arg target_commit_sha "$target" \
            --arg binary_asset "$asset" \
            --arg binary_sha256 "$digest" \
            --arg resolution_schema "gooo/activity-cardinality-resolution/v1" \
            --argjson expected "$expected" \
            --slurpfile receipts "$RUNNER_TEMP/core-resolution-receipts.json" '
            ($receipts[0]) as $r |
            {
              schema:"gooo/link/core-activity-cardinality-observation/v1",
              core_release:{repository:$repository,tag:$tag,tag_object_sha:$tag_object_sha,target_commit_sha:$target_commit_sha,binary_asset:$binary_asset,binary_sha256:$binary_sha256,resolution_schema:$resolution_schema},
              summary:{expected:$expected,observed:($r|length),closed:([$r[]|select(.decision=="CLOSED")]|length),unknown:([$r[]|select(.decision=="UNKNOWN")]|length),refuted:([$r[]|select(.decision=="REFUTED")]|length),unique_activity_selectors:([$r[].selector.name]|unique|length)},
              receipts:$r
            }
          ' > "$RUNNER_TEMP/core-resolution-observation.json"
          jq -e '.summary=={expected:12,observed:12,closed:12,unknown:0,refuted:0,unique_activity_selectors:12}' "$RUNNER_TEMP/core-resolution-observation.json" >/dev/null

      - name: Download and verify immutable consumer releases
        shell: bash
        run: |
          set -euo pipefail
          locks=contracts/generator-consumer-release-locks-v1.json
          download_consumer() {
            id=$1
            repository=$(jq -r --arg id "$id" '.consumers[]|select(.id==$id)|.repository' "$locks")
            tag=$(jq -r --arg id "$id" '.consumers[]|select(.id==$id)|.tag' "$locks")
            tag_object=$(jq -r --arg id "$id" '.consumers[]|select(.id==$id)|.tag_object_sha' "$locks")
            target=$(jq -r --arg id "$id" '.consumers[]|select(.id==$id)|.target_commit_sha' "$locks")
            gh api "repos/$repository/git/ref/tags/$tag" > "$RUNNER_TEMP/$id-ref.json"
            jq -e --arg sha "$tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/$id-ref.json" >/dev/null
            gh api "repos/$repository/git/tags/$tag_object" > "$RUNNER_TEMP/$id-tag.json"
            jq -e --arg sha "$target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/$id-tag.json" >/dev/null
            gh api "repos/$repository/releases/tags/$tag" > "$RUNNER_TEMP/$id-release.json"
            for kind in adoption bundle; do
              name=$(jq -r --arg id "$id" --arg kind "$kind" '.consumers[]|select(.id==$id)|.assets[]|select(.kind==$kind)|.name' "$locks")
              digest=$(jq -r --arg id "$id" --arg kind "$kind" '.consumers[]|select(.id==$id)|.assets[]|select(.kind==$kind)|.sha256' "$locks")
              asset_id=$(jq -r --arg name "$name" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/$id-release.json")
              destination="$RUNNER_TEMP/$id-$kind"
              if [[ "$kind" == "bundle" ]]; then
                destination="$RUNNER_TEMP/$id-bundle.tar.gz"
              fi
              gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$destination"
              printf '%s  %s\n' "$digest" "$destination" | sha256sum -c -
            done
            mkdir -p "$RUNNER_TEMP/$id-bundle"
            tar -xzf "$RUNNER_TEMP/$id-bundle.tar.gz" -C "$RUNNER_TEMP/$id-bundle"
            manifest="$RUNNER_TEMP/$id-bundle/generation-manifest.json"
            verified=0
            while IFS=$'\t' read -r path expected; do
              actual=$(sha256sum "$RUNNER_TEMP/$id-bundle/$path" | awk '{print $1}')
              test "$actual" = "$expected"
              verified=$((verified+1))
            done < <(jq -r '.files[]|[.path,.sha256]|@tsv' "$manifest")
            test "$verified" -eq 6
            jq -e --arg target "$target" '.subject_sha==$target and .adoption_state=="MAIN_MERGED"' "$RUNNER_TEMP/$id-adoption" >/dev/null
            jq -S -n --arg id "$id" --arg repository "$repository" --arg target "$target" --argjson assets_verified 2 --argjson manifest_entries_verified "$verified" '{id:$id,repository:$repository,target_sha:$target,identity_verified:true,assets_verified:$assets_verified,manifest_entries_verified:$manifest_entries_verified}' > "$RUNNER_TEMP/$id-observation.json"
          }
          download_consumer local-ledger
          download_consumer design-evidence
          jq -S -s '{schema:"gooo/link/generator-consumer-release-observation/v1",consumers:.}' "$RUNNER_TEMP/local-ledger-observation.json" "$RUNNER_TEMP/design-evidence-observation.json" > "$RUNNER_TEMP/release-observation.json"

      - name: Select shared primitive and preserve counterexamples
        shell: bash
        run: |
          set -euo pipefail
          snapshot() {
            find "$GITHUB_WORKSPACE" -path "$GITHUB_WORKSPACE/.git" -prune -o -type f -print0 |
              sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}'
          }
          before=$(snapshot)
          selector=scripts/select-core-improvement.sh
          args=("$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/core-resolution-observation.json" contracts/core-improvement-selection-denominator-v1.json contracts/generator-consumer-release-locks-v1.json "$RUNNER_TEMP/release-observation.json")
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/selector-rss" bash "$selector" "${args[@]}" "$RUNNER_TEMP/local-ledger-adoption" "$RUNNER_TEMP/local-ledger-bundle" "$RUNNER_TEMP/design-evidence-adoption" "$RUNNER_TEMP/design-evidence-bundle" "$RUNNER_TEMP/selection.json" "$SUBJECT_SHA" complete
          end_ns=$(date +%s%N)
          echo $(( (end_ns-start_ns)/1000000 )) > "$RUNNER_TEMP/selector-wall-ms"
          bash "$selector" "${args[@]}" "$RUNNER_TEMP/local-ledger-adoption" "$RUNNER_TEMP/local-ledger-bundle" "$RUNNER_TEMP/design-evidence-adoption" "$RUNNER_TEMP/design-evidence-bundle" "$RUNNER_TEMP/replay.json" "$SUBJECT_SHA" complete
          cmp -s "$RUNNER_TEMP/selection.json" "$RUNNER_TEMP/replay.json"
          jq -e '.decision=="CORE_RELEASE_ADOPTED" and .summary=={total:12,closed:12,unknown:0,refuted:0,direct_missing:0,dependency_blocked:0,consumers:2} and .candidate.state=="ADOPTED_FROM_CORE_RELEASE" and .candidate.implementation_status=="RELEASED_AND_CONSUMED" and .core_adoption.identity_verified and .core_adoption.summary=={required:12,observed:12,unique_activity_selectors:12,closed:12,unknown:0,refuted:0} and ([.proofs[]|select(.closed==4 and .total==4)]|length)==3' "$RUNNER_TEMP/selection.json" >/dev/null

          printf 'null\n' > "$RUNNER_TEMP/missing-local-adoption.json"
          bash "$selector" "${args[@]}" "$RUNNER_TEMP/missing-local-adoption.json" "$RUNNER_TEMP/local-ledger-bundle" "$RUNNER_TEMP/design-evidence-adoption" "$RUNNER_TEMP/design-evidence-bundle" "$RUNNER_TEMP/missing-adoption.json" "$SUBJECT_SHA" missing-local-adoption
          jq -e '.decision=="INCOMPLETE" and .summary.closed==2 and .summary.unknown==10 and .summary.refuted==0 and .summary.direct_missing==1 and .summary.dependency_blocked==9 and .claim.stage=="ADOPTION" and .claim.reason=="MERGED_ADOPTION_RECEIPT_UNAVAILABLE"' "$RUNNER_TEMP/missing-adoption.json" >/dev/null

          jq '.missing.direct_missing=0' "$RUNNER_TEMP/local-ledger-adoption" > "$RUNNER_TEMP/mutated-local-adoption.json"
          bash "$selector" "${args[@]}" "$RUNNER_TEMP/mutated-local-adoption.json" "$RUNNER_TEMP/local-ledger-bundle" "$RUNNER_TEMP/design-evidence-adoption" "$RUNNER_TEMP/design-evidence-bundle" "$RUNNER_TEMP/refuted-selection.json" "$SUBJECT_SHA" mutated-direct-missing
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==9 and .summary.refuted==3 and .claim.stage=="UNCERTAINTY" and .claim.step=="COMPARE_MISSING_RESOLUTION" and .claim.reason=="DIRECT_MISSING_INVARIANT_MISMATCH"' "$RUNNER_TEMP/refuted-selection.json" >/dev/null

          jq 'del(.receipts[0])' "$RUNNER_TEMP/core-resolution-observation.json" > "$RUNNER_TEMP/missing-core-resolution-observation.json"
          missing_core_args=("$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/missing-core-resolution-observation.json" contracts/core-improvement-selection-denominator-v1.json contracts/generator-consumer-release-locks-v1.json "$RUNNER_TEMP/release-observation.json")
          bash "$selector" "${missing_core_args[@]}" "$RUNNER_TEMP/local-ledger-adoption" "$RUNNER_TEMP/local-ledger-bundle" "$RUNNER_TEMP/design-evidence-adoption" "$RUNNER_TEMP/design-evidence-bundle" "$RUNNER_TEMP/missing-core-resolution.json" "$SUBJECT_SHA" missing-core-resolution
          jq -e '.decision=="INCOMPLETE" and .summary.closed==0 and .summary.unknown==12 and .summary.direct_missing==1 and .summary.dependency_blocked==11 and .candidate.state=="UNKNOWN" and .claim.stage=="RESOLUTION_OBSERVATION" and .claim.step=="BIND_CORE_ACTIVITY_RESOLUTION_RECEIPT" and .claim.reason=="CORE_ACTIVITY_RESOLUTION_RECEIPT_UNAVAILABLE"' "$RUNNER_TEMP/missing-core-resolution.json" >/dev/null

          jq '(.receipts[0].decision)="FIXED_POINT"' "$RUNNER_TEMP/core-resolution-observation.json" > "$RUNNER_TEMP/invalid-core-decision-observation.json"
          invalid_core_args=("$RUNNER_TEMP/graph.json" "$RUNNER_TEMP/invalid-core-decision-observation.json" contracts/core-improvement-selection-denominator-v1.json contracts/generator-consumer-release-locks-v1.json "$RUNNER_TEMP/release-observation.json")
          bash "$selector" "${invalid_core_args[@]}" "$RUNNER_TEMP/local-ledger-adoption" "$RUNNER_TEMP/local-ledger-bundle" "$RUNNER_TEMP/design-evidence-adoption" "$RUNNER_TEMP/design-evidence-bundle" "$RUNNER_TEMP/invalid-core-decision.json" "$SUBJECT_SHA" invalid-core-decision
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==0 and .summary.refuted==12 and .candidate.state=="REFUTED" and .claim.stage=="RESOLUTION" and .claim.step=="RESOLVE_ACTIVITY_CARDINALITY" and .claim.reason=="UNRECOGNIZED_CORE_ACTIVITY_RESOLUTION_DECISION"' "$RUNNER_TEMP/invalid-core-decision.json" >/dev/null

          after=$(snapshot)
          if [ "$before" = "$after" ]; then writes=0; else writes=1; fi
          jq -S -n --arg subject_sha "$SUBJECT_SHA" --arg before "$before" --arg after "$after" --argjson writes "$writes" --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/selector-rss")" --argjson wall_ms "$(cat "$RUNNER_TEMP/selector-wall-ms")" '{schema:"gooo/link/core-improvement-selection-runtime/v1",subject_sha:$subject_sha,selector:{peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms},repository:{before_digest:$before,after_digest:$after,writes:$writes},deterministic_replay:true,local_tests_run:0}' > "$RUNNER_TEMP/runtime.json"
          jq -e '.repository.writes==0 and .deterministic_replay and .local_tests_run==0' "$RUNNER_TEMP/runtime.json" >/dev/null

          {
            echo '## Evidence-selected core improvement'
            jq -r '"- selection: \(.summary.closed)/\(.summary.total) CLOSED; consumers \(.summary.consumers)","- candidate: \(.candidate.id)","- state: \(.candidate.state)","- implementation: \(.candidate.implementation_status)","- core receipts: \(.core_adoption.summary.closed)/\(.core_adoption.summary.required) CLOSED from \(.core_adoption.release.tag)","- local missing/direct: \(.comparison.common.direct_missing[0]); design missing/direct: \(.comparison.common.direct_missing[1])","- domain blocked counts: \(.comparison.variation.dependency_blocked|join(", "))","- domain duplicate refutations: \(.comparison.variation.duplicate_refuted|join(", "))"' "$RUNNER_TEMP/selection.json"
            jq -r '"- missing adoption: UNKNOWN \(.summary.unknown); direct \(.summary.direct_missing); blocked \(.summary.dependency_blocked)"' "$RUNNER_TEMP/missing-adoption.json"
            jq -r '"- mutated invariant: REFUTED \(.summary.refuted); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/refuted-selection.json"
            jq -r '"- missing core receipt: UNKNOWN \(.summary.unknown); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/missing-core-resolution.json"
            jq -r '"- invalid core decision: REFUTED \(.summary.refuted); first \(.claim.stage) / \(.claim.step) / \(.claim.reason)"' "$RUNNER_TEMP/invalid-core-decision.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recompute portfolio-aware core selection
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/gooo-link-v0.7-release-lock-v1.json
          repository=$(jq -r .repository "$lock")
          tag=$(jq -r .tag "$lock")
          tag_object=$(jq -r .tag_object_sha "$lock")
          target=$(jq -r .target_commit_sha "$lock")
          gh api "repos/$repository/git/ref/tags/$tag" > "$RUNNER_TEMP/portfolio-ref.json"
          jq -e --arg sha "$tag_object" '.object.type=="tag" and .object.sha==$sha' "$RUNNER_TEMP/portfolio-ref.json" >/dev/null
          gh api "repos/$repository/git/tags/$tag_object" > "$RUNNER_TEMP/portfolio-tag.json"
          jq -e --arg sha "$target" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/portfolio-tag.json" >/dev/null
          gh api "repos/$repository/releases/tags/$tag" > "$RUNNER_TEMP/portfolio-release.json"
          for kind in promotion consumer-releases queue; do
            name=$(jq -r --arg kind "$kind" '.assets[]|select(.kind==$kind)|.name' "$lock")
            digest=$(jq -r --arg kind "$kind" '.assets[]|select(.kind==$kind)|.sha256' "$lock")
            asset_id=$(jq -r --arg name "$name" '.assets[]|select(.name==$name)|.id' "$RUNNER_TEMP/portfolio-release.json")
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$RUNNER_TEMP/portfolio-$kind.json"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/portfolio-$kind.json" | sha256sum -c -
          done
          jq -e '.decision=="GENERATOR_PROMOTION_ELIGIBLE" and .summary.closed==12 and .observations.independent_consumers=={observed:2,total:2}' "$RUNNER_TEMP/portfolio-promotion.json" >/dev/null
          echo '::notice title=Portfolio selection stage::PINNED_RELEASE_EVIDENCE_CLOSED'

          source=examples/portfolio-core-selection/main.gooo
          denominator=contracts/portfolio-core-selection-denominator-v1.json
          gooo="$RUNNER_TEMP/core/gooo"
          "$gooo" check --json "$source" > "$RUNNER_TEMP/portfolio-syntax.json"
          "$gooo" check --semantic --json "$source" > "$RUNNER_TEMP/portfolio-semantic.json"
          "$gooo" graph dump "$source" > "$RUNNER_TEMP/portfolio-graph.json"
          jq -e '.status=="ok"' "$RUNNER_TEMP/portfolio-syntax.json" "$RUNNER_TEMP/portfolio-semantic.json" >/dev/null
          jq -e '([.nodes[]|select(.kind=="Activity")]|length)==12' "$RUNNER_TEMP/portfolio-graph.json" >/dev/null
          while IFS=$'\t' read -r activity; do
            "$gooo" graph resolve-activity "$source" --name "$activity" > "$RUNNER_TEMP/portfolio-$activity.json"
            jq -e --arg activity "$activity" '.decision=="CLOSED" and .selector.name==$activity and .occurrences==1 and .claim.state=="CLOSED"' "$RUNNER_TEMP/portfolio-$activity.json" >/dev/null
          done < <(jq -r '.cells[]|[.activity]|@tsv' "$denominator")
          echo '::notice title=Portfolio selection stage::GOOO_ACTIVITY_BINDING_CLOSED'

          snapshot_lock=contracts/core-experiment-backlog-snapshot-lock-v1.json
          snapshot_policy=contracts/core-experiment-backlog-snapshot-policy-v1.json
          snapshot=contracts/core-experiment-backlog-v1.json
          snapshot_state=UNKNOWN
          snapshot_stage=OBSERVATION
          snapshot_step=BIND_CORE_EXPERIMENT_BACKLOG_SNAPSHOT
          snapshot_reason=CORE_EXPERIMENT_BACKLOG_SNAPSHOT_UNAVAILABLE
          snapshot_unknown_class=DIRECT_MISSING
          snapshot_next_operation=PROVIDE_CORE_EXPERIMENT_BACKLOG_SNAPSHOT
          snapshot_source_release_or_run=
          snapshot_source_digest=
          snapshot_artifact_digest=
          snapshot_policy_digest=
          if test -f "$snapshot_lock" && test -f "$snapshot_policy" && test -f "$snapshot" && test -f contracts/cross-consumer-release-lock-v1.json; then
            actual_snapshot_digest="sha256:$(sha256sum "$snapshot" | awk '{print $1}')"
            actual_policy_digest="sha256:$(sha256sum "$snapshot_policy" | awk '{print $1}')"
            set +e
            jq -e \
              --arg snapshot_digest "$actual_snapshot_digest" \
              --arg policy_digest "$actual_policy_digest" \
              --slurpfile source_lock contracts/cross-consumer-release-lock-v1.json \
              --slurpfile policy "$snapshot_policy" \
              --slurpfile payload "$snapshot" '
                ($source_lock[0].inputs | map(select(.id=="core-experiment-backlog")) | .[0]) as $source |
                ($policy[0]) as $p |
                ($payload[0]) as $b |
                .schema=="gooo/link/core-experiment-backlog-snapshot-lock/v1" and
                .snapshot_path=="contracts/core-experiment-backlog-v1.json" and
                .snapshot_sha256==$snapshot_digest and
                .policy.path=="contracts/core-experiment-backlog-snapshot-policy-v1.json" and
                .policy.id==$p.id and .policy.digest==$policy_digest and
                .source.repository==$source.repository and
                .source.tag==$source.tag and .source.ref_type==$source.ref_type and
                .source.tag_object_sha==$source.tag_object_sha and
                .source.target_commit_sha==$source.target_commit_sha and
                .source.asset.id==$source.assets[0].id and
                .source.asset.name==$source.assets[0].name and
                .source.asset.sha256==( "sha256:" + $source.assets[0].sha256 ) and
                .source.payload_repository==$b.repository and
                .source.payload_schema==$b.schema and
                .expected.observed_open_experiments==$b.observed_open_experiments and
                .expected.experiment_count==($b.experiments|length) and
                (.expected.numbers|sort)==($b.experiments|map(.number)|sort) and
                $p.schema=="gooo/link/core-experiment-backlog-snapshot-policy/v1" and
                $p.source_binding.committed_snapshot=="REQUIRED" and
                $p.source_binding.snapshot_digest=="REQUIRED" and
                $p.source_binding.source_release_or_run=="REQUIRED" and
                $p.source_binding.policy_digest=="REQUIRED" and
                $p.source_binding.live_pull_request_api_as_closed_input=="PROHIBITED" and
                $p.decision_precedence==["REFUTED","UNKNOWN","CLOSED"] and
                $b.schema=="gooo/link/core-experiment-backlog/v1" and
                $b.repository=="kimjooyoon/meta-ontology-go" and
                $b.observed_open_experiments==29 and ($b.experiments|length)==29
              ' "$snapshot_lock" >/dev/null
            validation_status=$?
            set -e
            if test "$validation_status" -eq 0; then
              snapshot_state=VALID
              snapshot_source_release_or_run="$(jq -r '.source.repository + "@" + .source.tag + "#asset:" + (.source.asset.id|tostring)' "$snapshot_lock")"
              snapshot_source_digest=$(jq -r '.source.asset.sha256' "$snapshot_lock")
              snapshot_artifact_digest="$actual_snapshot_digest"
              snapshot_policy_digest="$actual_policy_digest"
            else
              snapshot_unknown_class=STALE
              snapshot_reason=CORE_EXPERIMENT_BACKLOG_SNAPSHOT_STALE
              snapshot_next_operation=REFRESH_CORE_EXPERIMENT_BACKLOG_SNAPSHOT
            fi
          fi
          if test "$snapshot_state" = VALID; then
            jq -S \
              --arg source_release_or_run "$snapshot_source_release_or_run" \
              --arg source_digest "$snapshot_source_digest" \
              --arg artifact_digest "$snapshot_artifact_digest" \
              --arg policy_digest "$snapshot_policy_digest" \
              '. + {snapshot:{state:"VALID",source_release_or_run:$source_release_or_run,source_digest:$source_digest,artifact_digest:$artifact_digest,policy_digest:$policy_digest}}' \
              "$snapshot" > "$RUNNER_TEMP/observed-backlog.json"
            jq -e '.snapshot.state=="VALID" and .observed_open_experiments==29 and (.experiments|length)==29 and .primitive_candidates_observed==0 and .mapped_pull_requests==0 and .merge_eligible_pull_requests==0' "$RUNNER_TEMP/observed-backlog.json" >/dev/null
            echo '::notice title=Portfolio selection stage::IMMUTABLE_CORE_EXPERIMENT_BACKLOG_SNAPSHOT_CLOSED'
          else
            jq -S -n \
              --arg repository "kimjooyoon/meta-ontology-go" \
              --arg stage "$snapshot_stage" \
              --arg step "$snapshot_step" \
              --arg reason "$snapshot_reason" \
              --arg unknown_class "$snapshot_unknown_class" \
              --arg next_operation "$snapshot_next_operation" \
              --arg source_release_or_run "$snapshot_source_release_or_run" \
              --arg source_digest "$snapshot_source_digest" \
              --arg artifact_digest "$snapshot_artifact_digest" \
              --arg policy_digest "$snapshot_policy_digest" \
              '{schema:"gooo/link/core-experiment-backlog/v1",repository:$repository,observed_open_experiments:null,primitive_candidates_observed:0,mapped_pull_requests:0,merge_eligible_pull_requests:0,mapping_state:"UNKNOWN",experiments:[],unknown_contract:{stage:$stage,step:$step,reason:$reason,unknown_class:$unknown_class,next_operation:$next_operation,blocked_by:["CORE_EXPERIMENT_BACKLOG_SNAPSHOT"]},stage:$stage,step:$step,reason:$reason,unknown_class:$unknown_class,next_operation:$next_operation,blocked_by:["CORE_EXPERIMENT_BACKLOG_SNAPSHOT"],snapshot:{state:"UNKNOWN",source_release_or_run:(if $source_release_or_run=="" then null else $source_release_or_run end),source_digest:(if $source_digest=="" then null else $source_digest end),artifact_digest:(if $artifact_digest=="" then null else $artifact_digest end),policy_digest:(if $policy_digest=="" then null else $policy_digest end)}}' \
              > "$RUNNER_TEMP/observed-backlog.json"
            echo '::notice title=Portfolio selection stage::IMMUTABLE_CORE_EXPERIMENT_BACKLOG_SNAPSHOT_UNKNOWN'
          fi

          cp "$RUNNER_TEMP/selection.json" "$RUNNER_TEMP/historical-selection.json"
          evaluator=scripts/recompute-portfolio-core-selection.sh
          args=("$RUNNER_TEMP/portfolio-graph.json" "$denominator" "$RUNNER_TEMP/portfolio-promotion.json" "$RUNNER_TEMP/portfolio-consumer-releases.json" "$RUNNER_TEMP/portfolio-queue.json" "$RUNNER_TEMP/historical-selection.json" "$RUNNER_TEMP/observed-backlog.json")
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/portfolio-selector-rss" bash "$evaluator" "${args[@]}" "$RUNNER_TEMP/selection.json" "$SUBJECT_SHA" complete
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns-start_ns)/1000000 ))
          bash "$evaluator" "${args[@]}" "$RUNNER_TEMP/portfolio-replay.json" "$SUBJECT_SHA" complete
          cmp -s "$RUNNER_TEMP/selection.json" "$RUNNER_TEMP/portfolio-replay.json"
          if test "$snapshot_state" = VALID; then
            jq -e '.decision=="CORE_PRIMITIVE_SELECTION_UNKNOWN" and .summary=={closed:5,dependency_blocked:5,direct_missing:2,external_consumers:2,mapped_pull_requests:0,merge_eligible_pull_requests:0,open_experiments:29,refuted:0,total:12,unknown:7} and .claim.state=="UNKNOWN" and .claim.reason=="CORE_PRIMITIVE_EVIDENCE_UNAVAILABLE" and .claim.unknown_class=="DIRECT_MISSING" and .claim.next_operation=="OBSERVE_CROSS_CONSUMER_PRIMITIVE_NEED" and .candidate.observed==0 and .experiments.mapped==0 and .experiments.merge_eligible==0 and .experiments.automatic_merge_allowed==false and .stale_operation.state=="REFUTED" and .snapshot.state=="VALID"' "$RUNNER_TEMP/selection.json" >/dev/null
            echo '::notice title=Portfolio selection stage::NORMAL_SELECTION_CLOSED'
          else
            jq -e '.decision=="CORE_PRIMITIVE_SELECTION_UNKNOWN" and .claim.state=="UNKNOWN" and .claim.stage=="OBSERVATION" and .claim.step=="BIND_CORE_EXPERIMENT_BACKLOG_SNAPSHOT" and ((.claim.reason=="CORE_EXPERIMENT_BACKLOG_SNAPSHOT_UNAVAILABLE") or (.claim.reason=="CORE_EXPERIMENT_BACKLOG_SNAPSHOT_STALE")) and ((.claim.unknown_class=="DIRECT_MISSING") or (.claim.unknown_class=="STALE")) and (.claim.next_operation|length)>0 and (.claim.blocked_by|length)>0 and .summary.refuted==0 and .snapshot.state=="UNKNOWN"' "$RUNNER_TEMP/selection.json" >/dev/null
            echo '::notice title=Portfolio selection stage::SNAPSHOT_FAILURE_FAILS_CLOSED_AS_UNKNOWN'
          fi

          jq '.snapshot.state="UNKNOWN" | .stage="OBSERVATION" | .step="BIND_CORE_EXPERIMENT_BACKLOG_SNAPSHOT" | .reason="CORE_EXPERIMENT_BACKLOG_SNAPSHOT_UNAVAILABLE" | .unknown_class="DIRECT_MISSING" | .next_operation="PROVIDE_CORE_EXPERIMENT_BACKLOG_SNAPSHOT" | .blocked_by=["CORE_EXPERIMENT_BACKLOG_SNAPSHOT"]' "$RUNNER_TEMP/observed-backlog.json" > "$RUNNER_TEMP/missing-backlog.json"
          missing_snapshot_args=("$RUNNER_TEMP/portfolio-graph.json" "$denominator" "$RUNNER_TEMP/portfolio-promotion.json" "$RUNNER_TEMP/portfolio-consumer-releases.json" "$RUNNER_TEMP/portfolio-queue.json" "$RUNNER_TEMP/historical-selection.json" "$RUNNER_TEMP/missing-backlog.json")
          bash "$evaluator" "${missing_snapshot_args[@]}" "$RUNNER_TEMP/missing-backlog-selection.json" "$SUBJECT_SHA" missing-backlog-snapshot
          jq -e '.decision=="CORE_PRIMITIVE_SELECTION_UNKNOWN" and .claim.state=="UNKNOWN" and .claim.stage=="OBSERVATION" and .claim.step=="BIND_CORE_EXPERIMENT_BACKLOG_SNAPSHOT" and .claim.reason=="CORE_EXPERIMENT_BACKLOG_SNAPSHOT_UNAVAILABLE" and .claim.unknown_class=="DIRECT_MISSING" and (.claim.next_operation|length)>0 and (.claim.blocked_by|length)>0 and .summary.refuted==0 and .snapshot.state=="UNKNOWN"' "$RUNNER_TEMP/missing-backlog-selection.json" >/dev/null
          echo '::notice title=Portfolio selection stage::MISSING_SNAPSHOT_UNKNOWN'

          jq '.snapshot.state="UNKNOWN" | .stage="OBSERVATION" | .step="BIND_CORE_EXPERIMENT_BACKLOG_SNAPSHOT" | .reason="CORE_EXPERIMENT_BACKLOG_SNAPSHOT_STALE" | .unknown_class="STALE" | .next_operation="REFRESH_CORE_EXPERIMENT_BACKLOG_SNAPSHOT" | .blocked_by=["CORE_EXPERIMENT_BACKLOG_SNAPSHOT"]' "$RUNNER_TEMP/observed-backlog.json" > "$RUNNER_TEMP/stale-backlog.json"
          stale_snapshot_args=("$RUNNER_TEMP/portfolio-graph.json" "$denominator" "$RUNNER_TEMP/portfolio-promotion.json" "$RUNNER_TEMP/portfolio-consumer-releases.json" "$RUNNER_TEMP/portfolio-queue.json" "$RUNNER_TEMP/historical-selection.json" "$RUNNER_TEMP/stale-backlog.json")
          bash "$evaluator" "${stale_snapshot_args[@]}" "$RUNNER_TEMP/stale-backlog-selection.json" "$SUBJECT_SHA" stale-backlog-snapshot
          jq -e '.decision=="CORE_PRIMITIVE_SELECTION_UNKNOWN" and .claim.state=="UNKNOWN" and .claim.stage=="OBSERVATION" and .claim.step=="BIND_CORE_EXPERIMENT_BACKLOG_SNAPSHOT" and .claim.reason=="CORE_EXPERIMENT_BACKLOG_SNAPSHOT_STALE" and .claim.unknown_class=="STALE" and (.claim.next_operation|length)>0 and (.claim.blocked_by|length)>0 and .summary.refuted==0 and .snapshot.state=="UNKNOWN"' "$RUNNER_TEMP/stale-backlog-selection.json" >/dev/null
          echo '::notice title=Portfolio selection stage::STALE_SNAPSHOT_UNKNOWN'

          printf 'null\n' > "$RUNNER_TEMP/missing-portfolio-promotion.json"
          missing_args=("$RUNNER_TEMP/portfolio-graph.json" "$denominator" "$RUNNER_TEMP/missing-portfolio-promotion.json" "$RUNNER_TEMP/portfolio-consumer-releases.json" "$RUNNER_TEMP/portfolio-queue.json" "$RUNNER_TEMP/historical-selection.json" "$RUNNER_TEMP/observed-backlog.json")
          bash "$evaluator" "${missing_args[@]}" "$RUNNER_TEMP/missing-portfolio-selection.json" "$SUBJECT_SHA" missing-promotion
          jq -e '.decision=="CORE_PRIMITIVE_SELECTION_UNKNOWN" and .summary.closed==0 and .summary.unknown==12 and .summary.direct_missing==3 and .summary.dependency_blocked==9 and .claim.reason=="GENERATOR_PROMOTION_RELEASE_UNAVAILABLE"' "$RUNNER_TEMP/missing-portfolio-selection.json" >/dev/null
          echo '::notice title=Portfolio selection stage::MISSING_PROMOTION_CASE_CLOSED'

          jq '.authority.generator_scope="CORE_LANGUAGE_PRIMITIVE"' "$RUNNER_TEMP/portfolio-promotion.json" > "$RUNNER_TEMP/scope-escalation-promotion.json"
          scope_args=("$RUNNER_TEMP/portfolio-graph.json" "$denominator" "$RUNNER_TEMP/scope-escalation-promotion.json" "$RUNNER_TEMP/portfolio-consumer-releases.json" "$RUNNER_TEMP/portfolio-queue.json" "$RUNNER_TEMP/historical-selection.json" "$RUNNER_TEMP/observed-backlog.json")
          bash "$evaluator" "${scope_args[@]}" "$RUNNER_TEMP/scope-escalation.json" "$SUBJECT_SHA" scope-escalation
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==4 and .summary.unknown==6 and .summary.refuted==2 and .claim.reason=="PORTFOLIO_EVIDENCE_SCOPE_ESCALATION"' "$RUNNER_TEMP/scope-escalation.json" >/dev/null
          echo '::notice title=Portfolio selection stage::SCOPE_ESCALATION_CASE_CLOSED'

          jq '.claim.next_operation="MERGE_CORE_EXPERIMENT"' "$RUNNER_TEMP/historical-selection.json" > "$RUNNER_TEMP/unauthorized-historical-selection.json"
          unauthorized_args=("$RUNNER_TEMP/portfolio-graph.json" "$denominator" "$RUNNER_TEMP/portfolio-promotion.json" "$RUNNER_TEMP/portfolio-consumer-releases.json" "$RUNNER_TEMP/portfolio-queue.json" "$RUNNER_TEMP/unauthorized-historical-selection.json" "$RUNNER_TEMP/observed-backlog.json")
          bash "$evaluator" "${unauthorized_args[@]}" "$RUNNER_TEMP/unauthorized-selection.json" "$SUBJECT_SHA" unauthorized-selection
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==4 and .summary.unknown==6 and .summary.refuted==2 and .claim.reason=="UNAUTHORIZED_OR_UNRECOGNIZED_NEXT_OPERATION"' "$RUNNER_TEMP/unauthorized-selection.json" >/dev/null
          echo '::notice title=Portfolio selection stage::UNAUTHORIZED_OPERATION_CASE_CLOSED'

          test -z "$(git status --porcelain=v1)"
          jq -S -n --arg subject_sha "$SUBJECT_SHA" --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/portfolio-selector-rss")" --argjson wall_ms "$wall_ms" '{schema:"gooo/link/portfolio-core-selection-runtime/v1",subject_sha:$subject_sha,selector:{peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms},repository_writes:0,local_tests_run:0,cross_project_required_gates:0}' > "$RUNNER_TEMP/portfolio-runtime.json"
          {
            echo '## Portfolio-aware core improvement selection'
            jq -r '"- decision: \(.decision)","- meta cells: \(.summary.closed)/\(.summary.total) CLOSED; UNKNOWN \(.summary.unknown); REFUTED \(.summary.refuted)","- direct missing / dependency blocked: \(.summary.direct_missing) / \(.summary.dependency_blocked)","- external consumers: \(.summary.external_consumers)/2","- core primitive candidates: \(.candidate.observed)/\(.candidate.required)","- experiment mappings: \(.experiments.mapped)/\(.experiments.open)","- merge-eligible experiment PRs: \(.experiments.merge_eligible)/1","- stale operation: \(.stale_operation.operation) [\(.stale_operation.state)]","- next operation: \(.claim.next_operation)"' "$RUNNER_TEMP/selection.json"
            jq -sr '"- missing promotion: CLOSED \(.[0].summary.closed), UNKNOWN \(.[0].summary.unknown), direct \(.[0].summary.direct_missing), dependency \(.[0].summary.dependency_blocked)","- scope escalation: CLOSED \(.[1].summary.closed), UNKNOWN \(.[1].summary.unknown), REFUTED \(.[1].summary.refuted), \(.[1].claim.reason)","- unauthorized selection: CLOSED \(.[2].summary.closed), UNKNOWN \(.[2].summary.unknown), REFUTED \(.[2].summary.refuted), \(.[2].claim.reason)"' "$RUNNER_TEMP/missing-portfolio-selection.json" "$RUNNER_TEMP/scope-escalation.json" "$RUNNER_TEMP/unauthorized-selection.json"
            jq -r '"- selector: \(.selector.peak_rss_kib) KiB / \(.selector.wall_ms) ms","- repository writes: \(.repository_writes)","- local test executions: \(.local_tests_run)","- cross-project required gates: \(.cross_project_required_gates)"' "$RUNNER_TEMP/portfolio-runtime.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-improvement-selection-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/selection.json
            ${{ runner.temp }}/historical-selection.json
            ${{ runner.temp }}/portfolio-replay.json
            ${{ runner.temp }}/missing-portfolio-selection.json
            ${{ runner.temp }}/scope-escalation.json
            ${{ runner.temp }}/unauthorized-selection.json
            ${{ runner.temp }}/portfolio-runtime.json
            ${{ runner.temp }}/portfolio-graph.json
            ${{ runner.temp }}/observed-backlog.json
            ${{ runner.temp }}/replay.json
            ${{ runner.temp }}/missing-adoption.json
            ${{ runner.temp }}/refuted-selection.json
            ${{ runner.temp }}/release-observation.json
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/graph.json
            ${{ runner.temp }}/core-resolution-observation.json
            ${{ runner.temp }}/missing-core-resolution.json
            ${{ runner.temp }}/invalid-core-decision.json
