name: Design user-path observation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-user-path-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCK: contracts/design-user-path-observation-release-lock-v1.json
      DENOMINATOR: contracts/design-user-path-observation-denominator-v1.json
      SOURCE: examples/design-user-path-observation/main.gooo
      OBSERVER: scripts/observe-design-user-path.sh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'

      - name: Observe Go 1.27 and fix only module roots
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          module_roots=0
          while IFS= read -r -d '' module; do
            module_roots=$((module_roots+1))
            (cd "$(dirname "$module")" && go fix ./...)
          done < <(find . -type f -name go.mod -not -path './.git/*' -print0)
          jq -S -n --arg go_version "$(go env GOVERSION)" --argjson module_roots "$module_roots" \
            '{schema:"gooo/link/design-user-path-go-fix/v1",go_version:$go_version,
              module_roots:$module_roots,go_fix_targets:$module_roots}' > "$RUNNER_TEMP/go-fix-observation.json"

      - name: Download three immutable releases
        shell: bash
        run: |
          set -euo pipefail
          for key in core link_baseline design_review; do
            repository=$(jq -r --arg key "$key" '.[$key].repository' "$LOCK")
            tag=$(jq -r --arg key "$key" '.[$key].tag' "$LOCK")
            ref=$(gh api "repos/$repository/git/ref/tags/$tag")
            test "$(jq -r .object.type <<<"$ref")" = "$(jq -r --arg key "$key" '.[$key].ref_type' "$LOCK")"
            test "$(jq -r .object.sha <<<"$ref")" = "$(jq -r --arg key "$key" '.[$key].tag_object_sha' "$LOCK")"
            test "$(jq -r .object.sha <<<"$ref")" = "$(jq -r --arg key "$key" '.[$key].target_commit_sha' "$LOCK")"
            release=$(gh api "repos/$repository/releases/tags/$tag")
            asset_id=$(jq -r --arg key "$key" '.[$key].asset.id' "$LOCK")
            asset_name=$(jq -r --arg key "$key" '.[$key].asset.name' "$LOCK")
            asset_size=$(jq -r --arg key "$key" '.[$key].asset.size' "$LOCK")
            test "$(jq -r --arg name "$asset_name" '.assets[]|select(.name==$name)|.id' <<<"$release")" = "$asset_id"
            test "$(jq -r --arg name "$asset_name" '.assets[]|select(.name==$name)|.size' <<<"$release")" = "$asset_size"
            archive="$RUNNER_TEMP/$key.archive"
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$archive"
            printf '%s  %s\n' "$(jq -r --arg key "$key" '.[$key].asset.sha256' "$LOCK")" "$archive" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/$key"
            if test "$(jq -r --arg key "$key" '.[$key].archive_type' "$LOCK")" = tar.gz; then
              tar -xzf "$archive" -C "$RUNNER_TEMP/$key"
            else
              unzip -q "$archive" -d "$RUNNER_TEMP/$key"
            fi
          done

      - name: Compile Link meta observation
        shell: bash
        run: |
          set -euo pipefail
          gooo="$RUNNER_TEMP/core/gooo"
          "$gooo" check --json "$SOURCE" > "$RUNNER_TEMP/design-link-syntax.json"
          "$gooo" check --semantic --json "$SOURCE" > "$RUNNER_TEMP/design-link-semantic.json"
          "$gooo" graph dump "$SOURCE" > "$RUNNER_TEMP/design-link-graph.json"
          jq -e '.status=="ok"' "$RUNNER_TEMP/design-link-syntax.json" "$RUNNER_TEMP/design-link-semantic.json" >/dev/null

      - name: Observe complete and adverse design paths
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/repository-before.bin"
          after="$RUNNER_TEMP/repository-after.bin"
          git status --porcelain=v1 -z --untracked-files=all > "$before"
          common=(
            "$RUNNER_TEMP/design-link-graph.json" "$RUNNER_TEMP/design_review/review-graph.json"
            "$DENOMINATOR" "$RUNNER_TEMP/link_baseline" "$RUNNER_TEMP/design_review"
          )
          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/design-observer-rss" \
            bash "$OBSERVER" "${common[@]}" "$RUNNER_TEMP/design-user-path-report.json" "$SUBJECT_SHA" complete
          bash "$OBSERVER" "${common[@]}" "$RUNNER_TEMP/design-user-path-replay.json" "$SUBJECT_SHA" complete
          cmp -s "$RUNNER_TEMP/design-user-path-report.json" "$RUNNER_TEMP/design-user-path-replay.json"

          cp -R "$RUNNER_TEMP/design_review" "$RUNNER_TEMP/design-missing"
          printf 'null\n' > "$RUNNER_TEMP/design-missing/design-review-conformance.json"
          missing_common=("${common[@]}")
          missing_common[4]="$RUNNER_TEMP/design-missing"
          bash "$OBSERVER" "${missing_common[@]}" "$RUNNER_TEMP/design-user-path-unknown.json" "$SUBJECT_SHA" missing-design-report

          cp -R "$RUNNER_TEMP/link_baseline" "$RUNNER_TEMP/link-baseline-tampered"
          jq '.summary.primitive_direct_mappings=6' "$RUNNER_TEMP/link-baseline-tampered/local-user-path-report.json" > "$RUNNER_TEMP/link-baseline-tampered/next.json"
          mv "$RUNNER_TEMP/link-baseline-tampered/next.json" "$RUNNER_TEMP/link-baseline-tampered/local-user-path-report.json"
          primitive_common=("${common[@]}")
          primitive_common[3]="$RUNNER_TEMP/link-baseline-tampered"
          bash "$OBSERVER" "${primitive_common[@]}" "$RUNNER_TEMP/design-user-path-primitive-refuted.json" "$SUBJECT_SHA" primitive-baseline-tamper

          cp -R "$RUNNER_TEMP/design_review" "$RUNNER_TEMP/design-metric-tampered"
          jq '.summary.generated_artifacts_observed=1' "$RUNNER_TEMP/design-metric-tampered/design-review-conformance.json" > "$RUNNER_TEMP/design-metric-tampered/next.json"
          mv "$RUNNER_TEMP/design-metric-tampered/next.json" "$RUNNER_TEMP/design-metric-tampered/design-review-conformance.json"
          metric_common=("${common[@]}")
          metric_common[4]="$RUNNER_TEMP/design-metric-tampered"
          bash "$OBSERVER" "${metric_common[@]}" "$RUNNER_TEMP/design-user-path-metric-refuted.json" "$SUBJECT_SHA" design-metric-tamper

          jq '(.nodes)|=map(select(.name!="GenerateHumanReviewPacket"))' "$RUNNER_TEMP/design_review/review-graph.json" > "$RUNNER_TEMP/design-graph-missing-meta.json"
          meta_common=("${common[@]}")
          meta_common[1]="$RUNNER_TEMP/design-graph-missing-meta.json"
          bash "$OBSERVER" "${meta_common[@]}" "$RUNNER_TEMP/design-user-path-meta-refuted.json" "$SUBJECT_SHA" missing-design-meta

          cp -R "$RUNNER_TEMP/design_review" "$RUNNER_TEMP/design-authority"
          jq '.authority.central_orchestration_authorized=true' "$RUNNER_TEMP/design-authority/design-review-packet.json" > "$RUNNER_TEMP/design-authority/next.json"
          mv "$RUNNER_TEMP/design-authority/next.json" "$RUNNER_TEMP/design-authority/design-review-packet.json"
          authority_common=("${common[@]}")
          authority_common[4]="$RUNNER_TEMP/design-authority"
          bash "$OBSERVER" "${authority_common[@]}" "$RUNNER_TEMP/design-user-path-authority-refuted.json" "$SUBJECT_SHA" authority-escalation

          jq '(.nodes)|=map(select(.name!="ObserveGeneratedReviewArtifacts"))' "$RUNNER_TEMP/design-link-graph.json" > "$RUNNER_TEMP/design-link-graph-missing-activity.json"
          missing_link_common=("${common[@]}")
          missing_link_common[0]="$RUNNER_TEMP/design-link-graph-missing-activity.json"
          if bash "$OBSERVER" "${missing_link_common[@]}" "$RUNNER_TEMP/missing-link-meta.json" "$SUBJECT_SHA" complete; then
            echo 'observer accepted a missing Link Gooo activity' >&2
            exit 1
          fi

          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns-start_ns)/1000000 ))
          git status --porcelain=v1 -z --untracked-files=all > "$after"
          if cmp -s "$before" "$after"; then writes=0; else writes=1; fi

          repository_files=0
          descendant_directories=0
          go_files=0
          go_lines=0
          gooo_files=0
          gooo_lines=0
          per_file='[]'
          while IFS= read -r -d '' file; do repository_files=$((repository_files+1)); done \
            < <(find . -type f -not -path './.git/*' -not -path './README.md' -print0)
          while IFS= read -r -d '' directory; do descendant_directories=$((descendant_directories+1)); done \
            < <(find . -mindepth 1 -type d -not -path './.git' -not -path './.git/*' -print0)
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file" | tr -d ' ')
            path=${file#./}
            case "$file" in
              *.go) language=Go; go_files=$((go_files+1)); go_lines=$((go_lines+lines)) ;;
              *.gooo) language=Gooo; gooo_files=$((gooo_files+1)); gooo_lines=$((gooo_lines+lines)) ;;
            esac
            per_file=$(jq -c --arg language "$language" --arg path "$path" --argjson lines "$lines" \
              '.+[{language:$language,path:$path,lines:$lines}]' <<<"$per_file")
          done < <(find . -type f \( -name '*.go' -o -name '*.gooo' \) -not -path './.git/*' -print0 | sort -z)

          jq -S -n --arg subject_sha "$SUBJECT_SHA" --arg go_version "$(go env GOVERSION)" \
            --argjson module_roots "$(jq .module_roots "$RUNNER_TEMP/go-fix-observation.json")" \
            --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/design-observer-rss")" --argjson wall_ms "$wall_ms" \
            --argjson writes "$writes" --argjson repository_files "$repository_files" \
            --argjson descendant_directories "$descendant_directories" --argjson go_files "$go_files" \
            --argjson go_lines "$go_lines" --argjson gooo_files "$gooo_files" --argjson gooo_lines "$gooo_lines" \
            --argjson per_file "$per_file" '
            {schema:"gooo/link/design-user-path-observation-runtime/v1",subject_sha:$subject_sha,
              go_version:$go_version,go_fix_module_roots:$module_roots,release_locks_observed:3,
              peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms,observer_replay_comparisons_equal:1,
              inventory:{repository_files:$repository_files,descendant_directories:$descendant_directories,
                root_readme_excluded:true,go:{files:$go_files,physical_lines:$go_lines},
                gooo:{files:$gooo_files,physical_lines:$gooo_lines},per_file:$per_file},
              repository_writes:$writes,local_tests_run:0,cross_project_required_gates:0}
          ' > "$RUNNER_TEMP/design-user-path-runtime.json"

      - name: Conform exact observation states
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .decision=="DESIGN_USER_PATH_OBSERVED" and .candidate.state=="OBSERVED" and
            .claim.state=="CLOSED" and .summary.total_cells==15 and .summary.closed_cells==15 and
            .summary.planned_user_verticals_previous==1 and .summary.planned_user_verticals_observed==2 and
            .summary.planned_user_verticals_total==3 and .summary.primitive_direct_mappings==5 and
            .summary.primitive_direct_mappings_total==30 and .summary.primitive_mapping_increment==0 and
            .summary.independent_consumers==4 and .summary.design_conformance_cells==15 and
            .summary.design_release_inputs==3 and .summary.design_review_requests==1 and
            .summary.design_relation_dispositions==4 and .summary.design_claim_tuples==4 and
            .summary.design_claim_fields==24 and .summary.design_meta_decision_receipts==5 and
            .summary.design_generated_artifacts==2 and .summary.design_counterexamples==4 and
            .summary.design_replay_comparisons==2 and .summary.repository_writes==0 and
            .summary.local_tests_run==0 and .summary.cross_project_required_gates==0 and
            ([.proofs[]|select(.closed==5 and .total==5)]|length)==3 and
            ([.indicator_classes[]|select(.closed==5 and .total==5)]|length)==3 and
            .authority.central_orchestration_authorized==false
          ' "$RUNNER_TEMP/design-user-path-report.json" >/dev/null
          jq -e '
            .decision=="DESIGN_USER_PATH_OBSERVATION_UNKNOWN" and .claim.state=="UNKNOWN" and
            .claim.stage=="PRODUCT_EVIDENCE" and .claim.reason=="DESIGN_CONFORMANCE_REPORT_UNAVAILABLE" and
            .claim.unknown_class=="DIRECT_MISSING" and .claim.next_operation=="RESTORE_DESIGN_CONFORMANCE_REPORT" and
            .summary.closed_cells==10 and .summary.unknown_cells==5 and .summary.planned_user_verticals_observed==1
          ' "$RUNNER_TEMP/design-user-path-unknown.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.reason=="PRIMITIVE_MAPPING_COUNT_INFLATED" and .summary.closed_cells==13 and .summary.refuted_cells==2' "$RUNNER_TEMP/design-user-path-primitive-refuted.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.reason=="GENERATED_REVIEW_ARTIFACT_COUNT_MISMATCH" and .summary.closed_cells==13 and .summary.refuted_cells==2' "$RUNNER_TEMP/design-user-path-metric-refuted.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.reason=="DESIGN_META_ACTIVITY_BINDING_MISMATCH" and .summary.closed_cells==13 and .summary.refuted_cells==2' "$RUNNER_TEMP/design-user-path-meta-refuted.json" >/dev/null
          jq -e '.decision=="FAIL_CLOSED" and .claim.reason=="CENTRAL_ORCHESTRATION_AUTHORITY_ESCALATED" and .summary.closed_cells==13 and .summary.refuted_cells==2' "$RUNNER_TEMP/design-user-path-authority-refuted.json" >/dev/null
          jq -e '
            .schema=="gooo/link/design-user-path-observation-runtime/v1" and .go_version=="go1.27.0" and
            .go_fix_module_roots==0 and .release_locks_observed==3 and .peak_rss_kib>0 and .wall_ms>=0 and
            .observer_replay_comparisons_equal==1 and .inventory.root_readme_excluded==true and
            (.inventory.per_file|length)==(.inventory.go.files+.inventory.gooo.files) and
            .repository_writes==0 and .local_tests_run==0 and .cross_project_required_gates==0
          ' "$RUNNER_TEMP/design-user-path-runtime.json" >/dev/null

      - name: Publish human-readable design observation
        shell: bash
        run: |
          {
            echo '## Gooo Link design user path'
            echo
            jq -r '
              "- Link cells: \(.summary.closed_cells)/\(.summary.total_cells) CLOSED",
              "- planned user verticals: \(.summary.planned_user_verticals_observed)/\(.summary.planned_user_verticals_total)",
              "- primitive mappings / increment: \(.summary.primitive_direct_mappings)/\(.summary.primitive_direct_mappings_total) / \(.summary.primitive_mapping_increment)",
              "- independent consumers: \(.summary.independent_consumers)",
              "- Design conformance cells: \(.summary.design_conformance_cells)/\(.summary.design_conformance_cells_total)",
              "- Design request / relations: \(.summary.design_review_requests)/\(.summary.design_review_requests_total) / \(.summary.design_relation_dispositions)/\(.summary.design_relation_dispositions_total)",
              "- Design claim tuples / fields: \(.summary.design_claim_tuples)/\(.summary.design_claim_tuples_total) / \(.summary.design_claim_fields)/\(.summary.design_claim_fields_total)",
              "- Design Gooo receipts / generated artifacts: \(.summary.design_meta_decision_receipts)/\(.summary.design_meta_decision_receipts_total) / \(.summary.design_generated_artifacts)/\(.summary.design_generated_artifacts_total)",
              "- writes / local tests / cross-project gates: \(.summary.repository_writes) / \(.summary.local_tests_run) / \(.summary.cross_project_required_gates)"
            ' "$RUNNER_TEMP/design-user-path-report.json"
            jq -r '
              "- observer peak RSS / wall time: \(.peak_rss_kib) KiB / \(.wall_ms) ms",
              "- files / descendant directories: \(.inventory.repository_files) / \(.inventory.descendant_directories)",
              "- Go files / lines: \(.inventory.go.files) / \(.inventory.go.physical_lines)",
              "- Gooo files / lines: \(.inventory.gooo.files) / \(.inventory.gooo.physical_lines)"
            ' "$RUNNER_TEMP/design-user-path-runtime.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce zero input-repository writes
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: design-user-path-observation-${{ env.SUBJECT_SHA }}
          path: |
            ${{ runner.temp }}/go-fix-observation.json
            ${{ runner.temp }}/design-link-syntax.json
            ${{ runner.temp }}/design-link-semantic.json
            ${{ runner.temp }}/design-link-graph.json
            ${{ runner.temp }}/design-user-path-report.json
            ${{ runner.temp }}/design-user-path-replay.json
            ${{ runner.temp }}/design-user-path-unknown.json
            ${{ runner.temp }}/design-user-path-primitive-refuted.json
            ${{ runner.temp }}/design-user-path-metric-refuted.json
            ${{ runner.temp }}/design-user-path-meta-refuted.json
            ${{ runner.temp }}/design-user-path-authority-refuted.json
            ${{ runner.temp }}/design-user-path-runtime.json
          if-no-files-found: warn
