name: Cross-consumer primitive mapping observation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-consumer-primitive-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observation:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - name: Verify immutable releases and download evidence
        shell: bash
        run: |
          set -euo pipefail
          lock=contracts/cross-consumer-release-lock-v2.json
          inputs="$RUNNER_TEMP/cross-consumer-inputs"
          mkdir -p "$inputs"

          verify_ref() {
            local repository=$1 tag=$2 expected_type=$3 expected_object=$4 expected_target=$5
            local ref actual_type actual_object actual_target
            ref=$(gh api "repos/$repository/git/ref/tags/$tag")
            actual_type=$(jq -r .object.type <<<"$ref")
            actual_object=$(jq -r .object.sha <<<"$ref")
            test "$actual_type" = "$expected_type"
            test "$actual_object" = "$expected_object"
            if test "$actual_type" = tag; then
              actual_target=$(gh api "repos/$repository/git/tags/$actual_object" --jq .object.sha)
            else
              actual_target=$actual_object
            fi
            test "$actual_target" = "$expected_target"
          }

          while IFS=$'\t' read -r repository tag ref_type tag_object target; do
            verify_ref "$repository" "$tag" "$ref_type" "$tag_object" "$target"
          done < <(jq -r '.inputs[]|[.repository,.tag,.ref_type,.tag_object_sha,.target_commit_sha]|@tsv' "$lock")

          while IFS=$'\t' read -r input_id repository tag asset_id name output digest; do
            release="$RUNNER_TEMP/release-$input_id.json"
            if ! test -f "$release"; then
              gh api "repos/$repository/releases/tags/$tag" > "$release"
            fi
            observed_id=$(jq -r --arg name "$name" '.assets[]|select(.name==$name)|.id' "$release")
            test "$observed_id" = "$asset_id"
            mkdir -p "$inputs/$input_id"
            destination="$inputs/$input_id/$output"
            gh api -H 'Accept: application/octet-stream' "repos/$repository/releases/assets/$asset_id" > "$destination"
            printf '%s  %s\n' "$digest" "$destination" | sha256sum -c -
          done < <(jq -r '.inputs[] as $input|$input.assets[]|[$input.id,$input.repository,$input.tag,(.id|tostring),.name,.output,.sha256]|@tsv' "$lock")

          core_repository=$(jq -r .core.repository "$lock")
          core_tag=$(jq -r .core.tag "$lock")
          core_type=$(jq -r .core.ref_type "$lock")
          core_object=$(jq -r .core.tag_object_sha "$lock")
          core_target=$(jq -r .core.target_commit_sha "$lock")
          verify_ref "$core_repository" "$core_tag" "$core_type" "$core_object" "$core_target"

          core_asset_id=$(jq -r .core.asset.id "$lock")
          core_asset_name=$(jq -r .core.asset.name "$lock")
          core_digest=$(jq -r .core.asset.sha256 "$lock")
          core_release="$RUNNER_TEMP/core-release.json"
          gh api "repos/$core_repository/releases/tags/$core_tag" > "$core_release"
          test "$(jq -r --arg name "$core_asset_name" '.assets[]|select(.name==$name)|.id' "$core_release")" = "$core_asset_id"
          gh api -H 'Accept: application/octet-stream' "repos/$core_repository/releases/assets/$core_asset_id" > "$RUNNER_TEMP/gooo.tar.gz"
          printf '%s  %s\n' "$core_digest" "$RUNNER_TEMP/gooo.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/core"
          tar -xzf "$RUNNER_TEMP/gooo.tar.gz" -C "$RUNNER_TEMP/core"

          core_source_path=$(jq -r .core.source.path "$lock")
          core_source_digest=$(jq -r .core.source.sha256 "$lock")
          gh api "repos/$core_repository/contents/$core_source_path?ref=$core_target" --jq .content |
            tr -d '\n' | base64 --decode > "$RUNNER_TEMP/core-claim-source.gooo"
          printf '%s  %s\n' "$core_source_digest" "$RUNNER_TEMP/core-claim-source.gooo" | sha256sum -c -
          grep -F 'gooo.primitive.claim-resolution-tuple.v1' "$RUNNER_TEMP/core-claim-source.gooo" >/dev/null

          mkdir -p "$inputs/local-ledger/actions" "$inputs/infra-evidence/actions"
          unzip -qq "$inputs/local-ledger/actions.zip" -d "$inputs/local-ledger/actions"
          unzip -qq "$inputs/infra-evidence/actions.zip" -d "$inputs/infra-evidence/actions"
          echo '::notice title=Cross-consumer stage::PINNED_RELEASE_AND_SOURCE_CLOSED'

      - name: Bind Gooo activities and observe primitive mapping
        shell: bash
        run: |
          set -euo pipefail
          source=examples/cross-consumer-primitive-mapping/main.gooo
          denominator=contracts/cross-consumer-primitive-mapping-denominator-v2.json
          lock=contracts/cross-consumer-release-lock-v2.json
          inputs="$RUNNER_TEMP/cross-consumer-inputs"
          gooo="$RUNNER_TEMP/core/gooo"
          evaluator=scripts/observe-cross-consumer-primitive-mapping.sh

          "$gooo" check --json "$source" > "$RUNNER_TEMP/cross-consumer-syntax.json"
          "$gooo" check --semantic --json "$source" > "$RUNNER_TEMP/cross-consumer-semantic.json"
          "$gooo" graph dump "$source" > "$RUNNER_TEMP/cross-consumer-graph.json"
          jq -e '.status=="ok"' "$RUNNER_TEMP/cross-consumer-syntax.json" "$RUNNER_TEMP/cross-consumer-semantic.json" >/dev/null
          jq -e '([.nodes[]|select(.kind=="Activity")]|length)==13' "$RUNNER_TEMP/cross-consumer-graph.json" >/dev/null
          while IFS=$'\t' read -r activity; do
            "$gooo" graph resolve-activity "$source" --name "$activity" > "$RUNNER_TEMP/cross-consumer-$activity.json"
            jq -e --arg activity "$activity" '.decision=="CLOSED" and .selector.name==$activity and .occurrences==1 and .claim.state=="CLOSED"' "$RUNNER_TEMP/cross-consumer-$activity.json" >/dev/null
          done < <(jq -r '.cells[]|[.activity]|@tsv' "$denominator")

          core_source="$RUNNER_TEMP/core-claim-source.gooo"
          "$gooo" check --json "$core_source" > "$RUNNER_TEMP/core-claim-syntax.json"
          "$gooo" graph dump "$core_source" > "$RUNNER_TEMP/core-claim-graph.json"
          core_activity=$(jq -r .core.source.activity "$lock")
          jq -e --arg activity "$core_activity" '([.nodes[]|select(.kind=="Activity")]|length)==6 and ([.nodes[]|select(.kind=="Activity" and .name==$activity)]|length)==1' "$RUNNER_TEMP/core-claim-graph.json" >/dev/null
          "$gooo" claim resolve "$core_source" --activity "$core_activity" --json > "$RUNNER_TEMP/core-claim.json"
          core_source_digest=$(jq -r .core.source.sha256 "$lock")
          jq -e --arg digest "sha256:$core_source_digest" '
            .schema=="gooo/claim-resolution/v1" and
            .candidate_id=="gooo.primitive.claim-resolution-tuple.v1" and
            .decision=="CLAIM_RESOLUTION_OBSERVED" and
            .subject.source_digest==$digest and
            .claim.state=="UNKNOWN" and
            .claim.unknown_class=="DIRECT_MISSING" and
            .summary=={fields_observed:6,fields_total:6,repository_writes:0,resolutions_observed:1,resolutions_total:1} and
            .authority.core_mutation_authorized==false and
            .authority.repository_writes==0
          ' "$RUNNER_TEMP/core-claim.json" >/dev/null

          args=(
            "$RUNNER_TEMP/cross-consumer-graph.json"
            "$denominator"
            "$inputs/local-ledger/complete.json"
            "$inputs/local-ledger/actions/missing-runbook.json"
            "$inputs/local-ledger/actions/source-refuted.json"
            "$inputs/design-evidence/complete.json"
            "$inputs/design-evidence/unknown-guard.json"
            "$inputs/infra-evidence/complete.json"
            "$inputs/infra-evidence/actions/missing-hcl.json"
            "$inputs/infra-evidence/actions/invalid-hcl.json"
            "$RUNNER_TEMP/core-claim.json"
            "$inputs/core-experiment-backlog/backlog.json"
          )

          start_ns=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$RUNNER_TEMP/cross-consumer-rss" bash "$evaluator" "${args[@]}" "$RUNNER_TEMP/cross-consumer-mapping.json" "$SUBJECT_SHA" complete
          end_ns=$(date +%s%N)
          wall_ms=$(( (end_ns-start_ns)/1000000 ))
          bash "$evaluator" "${args[@]}" "$RUNNER_TEMP/cross-consumer-replay.json" "$SUBJECT_SHA" complete
          cmp -s "$RUNNER_TEMP/cross-consumer-mapping.json" "$RUNNER_TEMP/cross-consumer-replay.json"
          jq -e '
            .decision=="CROSS_CONSUMER_PRIMITIVE_IMPLEMENTATION_OBSERVED" and
            .summary=={
              base_claim_consumers:3,claim_states:3,closed:13,common_envelopes:3,
              compatibility_gaps:1,consumer_releases:3,core_releases:1,
              dependency_blocked:0,direct_mappings:1,direct_missing:0,
              mapping_denominator:30,open_experiments:29,refuted:0,total:13,
              typed_unknown_roles:2,unknown:0,unknown_producers:2
            } and
            .claim.state=="CLOSED" and
            .claim.next_operation=="OBSERVE_INDEPENDENT_CONSUMER_ADOPTION" and
            .candidate.id=="gooo.primitive.claim-resolution-tuple.v1" and
            .candidate.state=="IMPLEMENTED" and
            .candidate.implementation_status=="RELEASED_EXPERIMENTAL" and
            .candidate.direct_mappings=={observed:1,total:30} and
            .experiments.direct_mappings==1 and
            .experiments.automatic_merge_allowed==false
          ' "$RUNNER_TEMP/cross-consumer-mapping.json" >/dev/null

          printf 'null\n' > "$RUNNER_TEMP/missing-core.json"
          missing_core_args=("${args[@]:0:10}" "$RUNNER_TEMP/missing-core.json" "${args[@]:11}")
          bash "$evaluator" "${missing_core_args[@]}" "$RUNNER_TEMP/missing-core-release.json" "$SUBJECT_SHA" missing-core-release
          jq -e '
            .decision=="CROSS_CONSUMER_PRIMITIVE_MAPPING_UNKNOWN" and
            .summary.closed==10 and .summary.unknown==3 and
            .summary.direct_missing==1 and .summary.dependency_blocked==2 and
            .summary.direct_mappings==0 and
            .claim.reason=="CORE_PRIMITIVE_RELEASE_UNAVAILABLE"
          ' "$RUNNER_TEMP/missing-core-release.json" >/dev/null

          printf 'null\n' > "$RUNNER_TEMP/missing-local.json"
          missing_args=("$RUNNER_TEMP/cross-consumer-graph.json" "$denominator" "$RUNNER_TEMP/missing-local.json" "$RUNNER_TEMP/missing-local.json" "$RUNNER_TEMP/missing-local.json" "${args[@]:5}")
          bash "$evaluator" "${missing_args[@]}" "$RUNNER_TEMP/missing-consumer-release.json" "$SUBJECT_SHA" missing-local-release
          jq -e '
            .decision=="CROSS_CONSUMER_PRIMITIVE_MAPPING_UNKNOWN" and
            .summary.closed==3 and .summary.unknown==10 and
            .summary.direct_missing==1 and .summary.dependency_blocked==9 and
            .summary.direct_mappings==1 and
            .claim.reason=="LOCAL_LEDGER_RELEASE_UNAVAILABLE"
          ' "$RUNNER_TEMP/missing-consumer-release.json" >/dev/null

          bash "$evaluator" "${args[@]}" "$RUNNER_TEMP/scope-escalation.json" "$SUBJECT_SHA" scope-escalation
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==11 and .summary.refuted==2 and .summary.direct_mappings==1 and .claim.reason=="OBSERVATION_EVIDENCE_SCOPE_ESCALATION"' "$RUNNER_TEMP/scope-escalation.json" >/dev/null

          jq '(.experiments[]|select(.number==548)) |= .+{candidate_id:"gooo.primitive.claim-resolution-tuple.v1",mapping_state:"MAPPED"}' "$inputs/core-experiment-backlog/backlog.json" > "$RUNNER_TEMP/title-only-backlog.json"
          title_args=("${args[@]:0:11}" "$RUNNER_TEMP/title-only-backlog.json")
          bash "$evaluator" "${title_args[@]}" "$RUNNER_TEMP/title-only-mapping.json" "$SUBJECT_SHA" title-only-mapping
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==11 and .summary.refuted==2 and .claim.reason=="TITLE_ONLY_EXPERIMENT_MAPPING_FORBIDDEN" and .experiments.candidate_mentions==1 and .experiments.direct_mappings==1' "$RUNNER_TEMP/title-only-mapping.json" >/dev/null

          jq '.claim.unknown_class="DIRECT_MISSING"' "$inputs/local-ledger/actions/missing-runbook.json" > "$RUNNER_TEMP/laundered-local-unknown.json"
          gap_args=("${args[@]:0:3}" "$RUNNER_TEMP/laundered-local-unknown.json" "${args[@]:4}")
          bash "$evaluator" "${gap_args[@]}" "$RUNNER_TEMP/gap-laundering.json" "$SUBJECT_SHA" gap-laundering
          jq -e '.decision=="FAIL_CLOSED" and .summary.closed==11 and .summary.refuted==2 and .summary.direct_mappings==1 and .claim.reason=="CLAIM_RESOLUTION_GAP_LAUNDERED"' "$RUNNER_TEMP/gap-laundering.json" >/dev/null

          test -z "$(git status --porcelain=v1)"
          jq -S -n --arg subject_sha "$SUBJECT_SHA" --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/cross-consumer-rss")" --argjson wall_ms "$wall_ms" '
            {schema:"gooo/link/cross-consumer-primitive-mapping-runtime/v2",subject_sha:$subject_sha,
             observer:{peak_rss_kib:$peak_rss_kib,wall_ms:$wall_ms},repository_writes:0,
             local_tests_run:0,cross_project_required_gates:0}
          ' > "$RUNNER_TEMP/cross-consumer-runtime.json"

          {
            echo '## Cross-consumer claim-resolution mapping'
            jq -r '[.decision,.summary.closed,.summary.total,.summary.direct_mappings,.summary.mapping_denominator,.claim.next_operation]|@tsv' "$RUNNER_TEMP/cross-consumer-mapping.json"
            jq -r '[.observer.peak_rss_kib,.observer.wall_ms,.repository_writes,.local_tests_run,.cross_project_required_gates]|@tsv' "$RUNNER_TEMP/cross-consumer-runtime.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cross-consumer mapping evidence
        uses: actions/upload-artifact@v6
        with:
          name: cross-consumer-primitive-mapping-${{ env.SUBJECT_SHA }}
          path: |
            ${{ runner.temp }}/cross-consumer-mapping.json
            ${{ runner.temp }}/cross-consumer-replay.json
            ${{ runner.temp }}/cross-consumer-runtime.json
            ${{ runner.temp }}/cross-consumer-graph.json
            ${{ runner.temp }}/core-claim-source.gooo
            ${{ runner.temp }}/core-claim.json
            ${{ runner.temp }}/missing-core-release.json
            ${{ runner.temp }}/missing-consumer-release.json
            ${{ runner.temp }}/scope-escalation.json
            ${{ runner.temp }}/title-only-mapping.json
            ${{ runner.temp }}/gap-laundering.json
          if-no-files-found: error
